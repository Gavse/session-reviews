<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<style>
  :root{
    --bg:#f7f6f4;
    --bg-2:#efedea;
    --ink:#1c1b19;
    --ink-soft:#6b6862;
    --line:rgba(0,0,0,.08);
    --card-radius:20px;
    --tile-radius:12px;
    --shadow-soft:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --shadow-lift:0 6px 14px rgba(0,0,0,.10),0 30px 60px rgba(0,0,0,.16);
    --ease:cubic-bezier(.22,.61,.36,1);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:#1c1b19;color:#fff}

  /* ============ LANDING ============ */
  #landing{
    max-width:1180px;
    margin:0 auto;
    padding:clamp(28px,6vw,80px) clamp(20px,5vw,56px) 96px;
  }
  .hero{
    padding:clamp(20px,4vw,40px) 4px clamp(16px,2.5vw,28px);
    text-align:center;
  }
  .hero .tagline{
    font-size:clamp(16px,2.2vw,22px);
    color:var(--ink-soft);
    opacity:.9;
    max-width:46ch;
    margin:0 auto;
    line-height:1.6;
    font-weight:500;
    letter-spacing:-.005em;
    direction:rtl;
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(16px,2vw,26px);
    margin-top:clamp(20px,4vw,44px);
  }
  .card{
    position:relative;
    aspect-ratio:3/4;
    border-radius:var(--card-radius);
    overflow:hidden;
    background:var(--bg-2);
    box-shadow:var(--shadow-soft);
    transition:transform .5s var(--ease),box-shadow .5s var(--ease);
    text-align:left;
    width:100%;
    display:block;
    isolation:isolate;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-6px);
    box-shadow:var(--shadow-lift);
    outline:none;
  }
  .card .cover{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    transition:transform .8s var(--ease),opacity .8s var(--ease);
    opacity:0;
    z-index:0;
  }
  .card .cover.loaded{opacity:1}
  .card:hover .cover,.card:focus-visible .cover{transform:scale(1.06)}
  .card .veil{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(0,0,0,0) 32%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.66) 100%);
  }
  .card .meta{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:clamp(18px,2.4vw,26px);
    color:#fff;
  }
  .card .heb{
    font-size:clamp(24px,3vw,34px);
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.05;
    direction:rtl;
    text-shadow:0 1px 18px rgba(0,0,0,.4);
  }
  .card .en{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    opacity:.86;
    margin-top:8px;
    font-weight:600;
  }
  .card .count{
    position:absolute;top:0;right:0;z-index:2;
    margin:clamp(14px,1.8vw,20px);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.04em;
    color:#fff;
    background:rgba(20,20,22,.34);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding:5px 11px;
    border-radius:999px;
  }

  /* Shuffle */
  .shuffle-wrap{margin-top:clamp(16px,2vw,26px)}
  .shuffle{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:22px;
    border-radius:var(--card-radius);
    background:var(--ink);
    color:#fff;
    font-size:clamp(15px,1.7vw,17px);
    font-weight:600;
    letter-spacing:.01em;
    box-shadow:var(--shadow-soft);
    transition:transform .4s var(--ease),box-shadow .4s var(--ease);
  }
  .shuffle:hover,.shuffle:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow-lift);outline:none}
  .shuffle svg{width:19px;height:19px;flex:none}
  .shuffle .sub{color:rgba(255,255,255,.6);font-weight:400;margin-left:4px}
  .foot{
    text-align:center;
    margin-top:clamp(40px,7vw,72px);
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:.03em;
  }

  /* ============ CATEGORY VIEW ============ */
  #catview{
    display:none;
    max-width:1320px;
    margin:0 auto;
    padding:clamp(20px,4vw,44px) clamp(16px,4vw,48px) 100px;
  }
  #catview.on{display:block}
  .catbar{
    display:flex;align-items:baseline;gap:18px;
    padding:14px 2px clamp(22px,3vw,34px);
    flex-wrap:wrap;
  }
  .back{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    padding:9px 15px 9px 11px;border-radius:999px;
    transition:background .3s var(--ease),color .3s var(--ease);
  }
  .back:hover,.back:focus-visible{background:var(--bg-2);color:var(--ink);outline:none}
  .back svg{width:16px;height:16px}
  .cattitle{display:flex;align-items:baseline;gap:12px;margin-left:auto}
  .cattitle .heb{font-size:clamp(20px,2.6vw,28px);font-weight:700;direction:rtl;letter-spacing:-.01em}
  .cattitle .en{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .cattitle .n{font-size:12.5px;color:var(--ink-soft);font-weight:500}

  /* Masonry: whole photos, natural aspect ratio, CSS multi-column */
  .grid{
    column-count:4;
    column-gap:14px;
  }
  .cell{
    position:relative;
    display:block;
    width:100%;
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    margin:0 0 14px;
    min-height:120px;
    border-radius:var(--tile-radius);
    overflow:hidden;
    background:var(--bg-2);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:transform .45s var(--ease),box-shadow .45s var(--ease);
  }
  .cell:hover,.cell:focus-visible{transform:translateY(-4px) scale(1.012);box-shadow:var(--shadow-lift);outline:none;z-index:2}
  .cell img{
    display:block;position:relative;z-index:1;
    width:100%;height:auto;
    opacity:0;transition:opacity .6s var(--ease),transform .8s var(--ease);
  }
  .cell img.loaded{opacity:1}
  .cell:hover img{transform:scale(1.05)}

  /* shimmer placeholder */
  .shimmer::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(100deg,var(--bg-2) 30%,#e4e1dc 50%,var(--bg-2) 70%);
    background-size:220% 100%;
    animation:sh 1.5s var(--ease) infinite;
  }
  .shimmer.done::before{display:none}
  @keyframes sh{0%{background-position:180% 0}100%{background-position:-40% 0}}

  /* ============ VIEWER ============ */
  #viewer{
    position:fixed;inset:0;z-index:100;
    background:#0a0a0b;
    display:none;
    align-items:center;justify-content:center;
    touch-action:none;
    opacity:0;transition:opacity .38s var(--ease);
  }
  #viewer.on{display:flex;opacity:1}
  #viewer.chrome-hidden{cursor:none}
  .stage{position:absolute;inset:0;overflow:hidden}
  .frame{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity .45s var(--ease);
    padding:0;
  }
  .frame.show{opacity:1}
  .frame img{
    max-width:100vw;max-height:100vh;
    width:auto;height:auto;
    object-fit:contain;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  .frame .vshim{
    position:absolute;width:min(60vw,340px);height:2px;overflow:hidden;border-radius:2px;
    background:rgba(255,255,255,.07);
  }
  .frame .vshim::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:vl 1.3s ease-in-out infinite;
  }
  @keyframes vl{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .chrome{transition:opacity .5s var(--ease);}
  #viewer.chrome-hidden .chrome{opacity:0!important}

  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    z-index:10;
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .3s var(--ease),transform .3s var(--ease),opacity .5s var(--ease);
  }
  .nav:hover{background:rgba(255,255,255,.16)}
  .nav:active{transform:translateY(-50%) scale(.92)}
  .nav svg{width:26px;height:26px}
  .nav.prev{left:clamp(10px,2.5vw,30px)}
  .nav.next{right:clamp(10px,2.5vw,30px)}

  .close{
    position:absolute;top:clamp(12px,2vw,22px);right:clamp(12px,2vw,22px);
    z-index:12;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .3s var(--ease),transform .3s var(--ease),opacity .5s var(--ease);
  }
  .close:hover{background:rgba(255,255,255,.16)}
  .close:active{transform:scale(.92)}
  .close svg{width:20px;height:20px}

  .headline{
    position:absolute;left:50%;bottom:clamp(18px,3.4vh,34px);
    transform:translateX(-50%);
    z-index:11;
    display:flex;align-items:center;gap:12px;
    color:rgba(255,255,255,.92);
    font-size:clamp(17px, 3.8vw, 24px);font-weight:500;letter-spacing:.06em;
    padding:10px 22px;border-radius:999px;
    background:rgba(255,255,255,.05);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    white-space:nowrap;
  }
  .headline .cat{color:#fff;font-weight:700;letter-spacing:.03em}
  .headline .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4)}
  .headline .pos{font-variant-numeric:tabular-nums}

  @media(max-width:900px){
    .cards{grid-template-columns:1fr;gap:16px}
    .card{aspect-ratio:16/10}
    .grid{column-count:3}
    .cattitle{margin-left:auto}
  }
  @media(max-width:560px){
    .grid{column-count:2}
    .nav{width:46px;height:46px}
    .nav.prev{left:6px}.nav.next{right:6px}
    .cattitle .en{display:none}
    /* Phone: categories first, then Shuffle All after the cards */
    #landing{display:flex;flex-direction:column}
    .hero{order:1}
    .cards{order:2;margin-top:clamp(18px,5vw,26px)}
    .shuffle-wrap{order:3;margin-top:clamp(18px,5vw,26px)}
    .foot{order:4}
  }
</style>

<main id="landing">
  <header class="hero">
    <p class="tagline" dir="rtl">כמה תמונות שצילמתי של המשפחה, או מתקופת קיימברידג׳ והרווארד (חוץ מהתמונה שלי בתור ילד)</p>
  </header>

  <section class="cards" id="cards" aria-label="Categories"></section>

  <div class="shuffle-wrap">
    <button class="shuffle" id="shuffleBtn" aria-label="Shuffle all photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      <span>Shuffle All</span>
    </button>
  </div>
</main>

<section id="catview" aria-label="Category grid">
  <div class="catbar">
    <button class="back" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      All galleries
    </button>
    <div class="cattitle">
      <span class="heb" id="catHeb"></span>
      <span class="en" id="catEn"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<div id="viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="stage" id="stage"></div>
  <button class="nav prev chrome" id="prevBtn" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="nav next chrome" id="nextBtn" aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="close chrome" id="closeBtn" aria-label="Close viewer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
  <div class="headline" id="headline">
    <span class="cat" id="hlCat"></span>
    <span class="dot" id="hlDot"></span>
    <span class="pos" id="hlPos"></span>
  </div>
</div>

/* ---------- URL helpers ---------- */
/* Google user-content endpoint: best color/fidelity, supports large sizes. Primary for the viewer. */
function hd(id,w){ return "https://lh3.googleusercontent.com/d/"+id+"=w"+w; }
/* Drive thumbnail endpoint: reliable fallback. */
function thumb(id,w){ return "https://drive.google.com/thumbnail?id="+id+"&sz=w"+w; }

/* Retina-aware HD size for the full-screen viewer (floored to 1600, capped 2560 for safety). */
function viewerW(){
  var w=Math.round((window.innerWidth||1280)*(window.devicePixelRatio||1));
  return Math.max(1600, Math.min(w,2560));
}
/* DPR-aware grid/cover thumbnail size (kept light, capped ~1200). */
function gridW(){
  return Math.min(Math.round(1000*(window.devicePixelRatio||1)),1200);
}

/* Robust image loader: lh3 HD primary, retry, then drive-thumbnail fallback, then smaller, then neutral placeholder (shimmer stays). */
function loadImage(imgEl, id, baseW, onOk){
  var attempt=0;
  // primary lh3 (best fidelity) -> retry same -> drive fallback same size -> drive smaller
  var cands=[ hd(id,baseW), hd(id,baseW), thumb(id,baseW), thumb(id,Math.min(baseW,600)) ];
  function go(){
    var url=cands[attempt];
    var probe=new Image();
    probe.decoding="async";
    probe.onload=function(){
      imgEl.src=probe.src;
      imgEl.classList.add("loaded");
      if(onOk) onOk();
    };
    probe.onerror=function(){
      attempt++;
      if(attempt<cands.length){ setTimeout(go, 500+attempt*400); }
      // else: leave shimmer/neutral placeholder in place, no broken icon
    };
    probe.src=url;
  }
  go();
}

/* ---------- Landing ---------- */
var order=["family","cambridge","harvard"];
function countOf(cat){ return PHOTOS.filter(function(p){return p.category===cat;}).length; }
function firstOf(cat){ return PHOTOS.filter(function(p){return p.category===cat;})[0]; }

/* Pinned cover overrides (specific photo ids). Falls back to firstOf(cat) when absent. */
var COVER = {
  family:    "1torHiLAyH6fSihQmXG2wa_Lrw0Nf_gDX", // 16th Family photo (IMG_6388.heic)
  cambridge: "1Sy36CmRMgZsC65jfvdFKcfglHO3Jsxog"  // 42nd Cambridge photo (IMG_8959.heic)
};
function coverOf(cat){ return COVER[cat] || firstOf(cat).id; }

var cardsEl=document.getElementById("cards");
order.forEach(function(cat){
  var c=CATS[cat], n=countOf(cat), coverId=coverOf(cat);
  var btn=document.createElement("button");
  btn.className="card";
  btn.setAttribute("aria-label",c.en+", "+n+" photos");
  btn.innerHTML=
    '<img class="cover" alt="'+c.en+' cover photo">'+
    '<div class="veil"></div>'+
    '<div class="meta"><div class="heb">'+c.heb+'</div><div class="en">'+c.en+'</div></div>';
  cardsEl.appendChild(btn);
  var cov=btn.querySelector(".cover");
  loadImage(cov, coverId, gridW());
  btn.addEventListener("click",function(){ openCategory(cat); });
});

/* ---------- Category grid ---------- */
var gridEl=document.getElementById("grid");
var landing=document.getElementById("landing");
var catview=document.getElementById("catview");
var currentList=[];   // list currently feeding the viewer
var currentCat=null;

function openCategory(cat){
  currentCat=cat;
  var c=CATS[cat];
  var list=PHOTOS.filter(function(p){return p.category===cat;});
  document.getElementById("catHeb").textContent=c.heb;
  document.getElementById("catEn").textContent=c.en;
  gridEl.innerHTML="";
  list.forEach(function(p,i){
    var cell=document.createElement("button");
    cell.className="cell shimmer";
    cell.setAttribute("aria-label",c.en+" photo "+(i+1));
    var img=document.createElement("img");
    img.alt=c.en+" photo "+(i+1);
    img.loading="lazy";
    cell.appendChild(img);
    cell.addEventListener("click",function(){ openViewer(list,i); });
    gridEl.appendChild(cell);
    loadImage(img, p.id, gridW(), function(){ cell.classList.add("done"); });
  });
  landing.style.display="none";
  catview.classList.add("on");
  window.scrollTo(0,0);
}

document.getElementById("backBtn").addEventListener("click",function(){
  catview.classList.remove("on");
  landing.style.display="";
  window.scrollTo(0,0);
});

/* ---------- Shuffle ---------- */
function shuffled(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
document.getElementById("shuffleBtn").addEventListener("click",function(){
  openViewer(shuffled(PHOTOS),0,true);
});

/* ---------- Viewer ---------- */
var viewer=document.getElementById("viewer");
var stage=document.getElementById("stage");
var hlCat=document.getElementById("hlCat");
var hlDot=document.getElementById("hlDot");
var hlPos=document.getElementById("hlPos");
var vIndex=0;
var isShuffle=false;  // true when viewer opened via Shuffle All, false when opened from a category
var frames={};       // index -> {frame,img,loaded}
var chromeTimer=null;

function openViewer(list,index,shuffle){
  currentList=list;
  isShuffle=!!shuffle;
  vIndex=index;
  frames={};
  stage.innerHTML="";
  viewer.classList.add("on");
  viewer.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  render();
  wakeChrome();
}
function closeViewer(){
  viewer.classList.remove("on");
  viewer.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  stage.innerHTML="";
  frames={};
  if(chromeTimer) clearTimeout(chromeTimer);
}

function ensureFrame(i){
  if(i<0||i>=currentList.length) return null;
  if(frames[i]) return frames[i];
  var p=currentList[i];
  var frame=document.createElement("div");
  frame.className="frame";
  var shim=document.createElement("div");
  shim.className="vshim";
  frame.appendChild(shim);
  var img=document.createElement("img");
  img.alt=(CATS[p.category].en)+" photo";
  frame.appendChild(img);
  stage.appendChild(frame);
  var rec={frame:frame,img:img,loaded:false};
  frames[i]=rec;
  loadImage(img, p.id, viewerW(), function(){
    rec.loaded=true;
    if(shim.parentNode) shim.parentNode.removeChild(shim);
  });
  return rec;
}

function render(){
  var p=currentList[vIndex];
  // show current
  var cur=ensureFrame(vIndex);
  Object.keys(frames).forEach(function(k){
    frames[k].frame.classList.toggle("show", (+k)===vIndex);
  });
  if(cur) cur.frame.classList.add("show");
  // preload neighbours
  ensureFrame(vIndex+1);
  ensureFrame(vIndex-1);
  // prune far frames to keep DOM light
  Object.keys(frames).forEach(function(k){
    if(Math.abs((+k)-vIndex)>1){
      if(frames[k].frame.parentNode) frames[k].frame.parentNode.removeChild(frames[k].frame);
      delete frames[k];
    }
  });
  // headline: name always; position + dot only in category mode (hidden in shuffle)
  hlCat.textContent=p.place||CATS[p.category].en;
  if(isShuffle){
    hlDot.style.display="none";
    hlPos.style.display="none";
    hlPos.textContent="";
  } else {
    hlDot.style.display="";
    hlPos.style.display="";
    hlPos.textContent=(vIndex+1)+" / "+currentList.length;
  }
  // arrow availability
  document.getElementById("prevBtn").style.visibility = vIndex>0 ? "visible":"hidden";
  document.getElementById("nextBtn").style.visibility = vIndex<currentList.length-1 ? "visible":"hidden";
}

function go(delta){
  var n=vIndex+delta;
  if(n<0||n>=currentList.length) return;
  vIndex=n;
  render();
  wakeChrome();
}

/* auto-hiding chrome */
function wakeChrome(){
  viewer.classList.remove("chrome-hidden");
  if(chromeTimer) clearTimeout(chromeTimer);
  chromeTimer=setTimeout(function(){ viewer.classList.add("chrome-hidden"); },2500);
}

document.getElementById("prevBtn").addEventListener("click",function(e){e.stopPropagation();go(-1);});
document.getElementById("nextBtn").addEventListener("click",function(e){e.stopPropagation();go(1);});
document.getElementById("closeBtn").addEventListener("click",function(e){e.stopPropagation();closeViewer();});

/* click outside image closes */
stage.addEventListener("click",function(e){
  if(e.target.tagName!=="IMG") closeViewer();
});

/* mouse movement reveals chrome */
viewer.addEventListener("mousemove",wakeChrome);

/* keyboard */
document.addEventListener("keydown",function(e){
  if(!viewer.classList.contains("on")) return;
  if(e.key==="Escape") closeViewer();
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
});

/* touch swipe */
var tsx=0,tsy=0,tst=0;
viewer.addEventListener("touchstart",function(e){
  var t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; tst=Date.now(); wakeChrome();
},{passive:true});
viewer.addEventListener("touchend",function(e){
  var t=e.changedTouches[0];
  var dx=t.clientX-tsx, dy=t.clientY-tsy, dt=Date.now()-tst;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.4 && dt<600){
    go(dx<0?1:-1);
  } else if(Math.abs(dx)<12 && Math.abs(dy)<12 && dt<400){
    // tap outside image closes
    if(e.target.tagName!=="IMG" && e.target.className!=="frame") { /* nav/close handle themselves */ }
  }
},{passive:true});
</script>
