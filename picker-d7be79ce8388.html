<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Picker - Reference Sheet</title>
<style>
  :root{
    --bg:#f7f6f4;
    --bg-2:#e9e7e3;
    --ink:#1c1b19;
    --ink-soft:#6b6862;
    --line:rgba(0,0,0,.10);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    padding:16px 14px 60px;
  }
  img{display:block;max-width:100%}

  .instruction{
    max-width:1100px;margin:0 auto 20px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;line-height:1.5;color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .instruction b{font-weight:700}
  .instruction code{
    font-family:var(--mono);font-size:13px;
    background:var(--bg-2);padding:2px 6px;border-radius:5px;
  }

  .wrap{max-width:1100px;margin:0 auto}

  .cathead{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:30px 0 14px;padding-bottom:8px;
    border-bottom:2px solid var(--ink);
  }
  .cathead .heb{font-size:22px;font-weight:700;direction:rtl}
  .cathead .en{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .cathead .n{font-size:13px;color:var(--ink-soft);font-weight:500;margin-left:auto}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  @media(min-width:620px){ .grid{grid-template-columns:repeat(4,1fr)} }
  @media(min-width:900px){ .grid{grid-template-columns:repeat(6,1fr)} }

  .tile{
    display:flex;flex-direction:column;gap:5px;
  }
  .caption{
    font-size:12px;font-weight:600;color:var(--ink);
    letter-spacing:.01em;
  }
  .thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    background:var(--bg-2);
    border:1px solid var(--line);
  }
  .thumb img{
    width:100%;height:100%;
    object-fit:cover;
  }
  .badge{
    position:absolute;top:6px;left:6px;
    min-width:30px;height:30px;
    padding:0 8px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(15,15,17,.78);
    color:#fff;
    font-size:17px;font-weight:800;
    font-variant-numeric:tabular-nums;
    border-radius:9px;
    line-height:1;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .fid{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--ink-soft);
    word-break:break-all;
    -webkit-user-select:all;user-select:all;
    line-height:1.25;
  }
</style>

<div class="instruction">
  Tell me numbers - e.g. <code>Family cover = 7</code> or <code>put Cambridge 30 after Cambridge 12</code>.
</div>

/* thumbnail URL: small fast size, drive fallback on error */
function thumbURL(id){ return "https://lh3.googleusercontent.com/d/"+id+"=w400"; }
function fallbackURL(id){ return "https://drive.google.com/thumbnail?id="+id+"&sz=w400"; }

var order=["family","cambridge","harvard"];
var wrap=document.getElementById("wrap");

order.forEach(function(cat){
  var c=CATS[cat];
  var list=PHOTOS.filter(function(p){return p.category===cat;});

  var head=document.createElement("div");
  head.className="cathead";
  head.innerHTML=
    '<span class="heb" dir="rtl">'+c.heb+'</span>'+
    '<span class="en">'+c.en+'</span>'+
    '<span class="n">'+list.length+' photos</span>';
  wrap.appendChild(head);

  var grid=document.createElement("div");
  grid.className="grid";
  wrap.appendChild(grid);

  list.forEach(function(p,i){
    var num=i+1;
    var label=c.en+" "+num;

    var tile=document.createElement("div");
    tile.className="tile";

    var cap=document.createElement("div");
    cap.className="caption";
    cap.textContent=label;

    var thumb=document.createElement("div");
    thumb.className="thumb";

    var img=document.createElement("img");
    img.loading="lazy";
    img.alt=label;
    img.src=thumbURL(p.id);
    (function(id){
      var tried=false;
      img.onerror=function(){
        if(tried) return;
        tried=true;
        img.src=fallbackURL(id);
      };
    })(p.id);

    var badge=document.createElement("div");
    badge.className="badge";
    badge.textContent=num;

    thumb.appendChild(img);
    thumb.appendChild(badge);

    var fid=document.createElement("div");
    fid.className="fid";
    fid.textContent=p.id;

    tile.appendChild(cap);
    tile.appendChild(thumb);
    tile.appendChild(fid);
    grid.appendChild(tile);
  });
});
